const $=s=>document.querySelector(s);let language='ja',active=null,lastFocus=null;
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function picture(item){const box=el('div','picture');const img=document.createElement('img');img.alt=item.values[1];img.loading='lazy';img.referrerPolicy='no-referrer';let attempt=0;function next(){if(attempt>=item.images.length){img.remove();box.append(el('span','placeholder','圖片暫無法顯示'));return}img.src=item.images[attempt++].url}img.onerror=next;box.append(img);next();return box}
function render(){const query=$('#search').value.trim().toLowerCase();const visible=items.filter(x=>x.values.join(' ').toLowerCase().includes(query));$('#grid').replaceChildren();for(const item of visible){const card=el('button','card');card.type='button';card.append(picture(item),el('span','name',item.values[language==='ja'?1:2]));card.addEventListener('click',()=>open(item,card));$('#grid').append(card)}$('#count').textContent=visible.length+' / '+items.length+' 項';$('#empty').hidden=visible.length>0;$('#ja').setAttribute('aria-pressed',language==='ja');$('#zh').setAttribute('aria-pressed',language==='zh')}
function link(label,url){const a=el('a',null,label);a.href=url;a.target='_blank';a.rel='noopener noreferrer';return a}
function open(item,trigger){active=item;lastFocus=trigger;const area=$('#detail');area.replaceChildren();const photo=el('div','detail-photo');photo.append(picture(item));const content=el('div');const h=el('h2',null,item.values[language==='ja'?1:2]);h.id='detail-title';content.append(h,el('div','subname',item.values[language==='ja'?2:1]));const dl=el('dl');const labels=['推薦','日文名稱','中文名稱','哪裡買得到','日幣價格','約台幣','店家限購狀況'];labels.forEach((label,i)=>dl.append(el('dt',null,label),el('dd',null,item.values[i]||'未提供')));content.append(dl);const links=el('div','links');if(item.images[0]){links.append(link('圖片來源 ↗',item.images[0].source||item.images[0].url),link('圖片連結 ↗',item.images[0].url))}links.append(link('搜尋商品圖片 ↗','https://www.google.com/search?tbm=isch&q='+encodeURIComponent(item.values[1]+' '+item.values[2].split(' ')[0])));content.append(links,el('p','note','價格與備註為清單記錄，並非即時庫存。圖片可能為相同商品的不同入數或包裝，請核對商品販售資訊。'));area.append(photo,content);$('#modal').showModal();$('#modal').scrollTop=0}
$('#search').addEventListener('input',render);$('#ja').onclick=()=>{language='ja';render()};$('#zh').onclick=()=>{language='zh';render()};$('.close').onclick=()=>$('#modal').close();$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()}});$('#modal').addEventListener('close',()=>{if(lastFocus?.isConnected)lastFocus.focus();active=null});render();
